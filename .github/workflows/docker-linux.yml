name: Linux

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base_image:
          - debian:trixie
          - ubuntu:26.04
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build
        run: |
          docker build \
            --build-arg "BASE_IMAGE=${{ matrix.base_image }}" \
            --platform "${{ matrix.platform }}" \
            --tag dotfiles \
            --file Dockerfile.linux \
            .
      - name: Test configurations
        run: |
          docker run --rm dotfiles ./test/linux-smoke.sh
